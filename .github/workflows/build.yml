name: build
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Install Gradle (with retries and mirrors)
        shell: bash
        run: |
          V=9.9.0
          ok=0
          for i in 1 2 3 4 5; do
            for U in \
              "https://services.gradle.org/distributions/gradle-$V-bin.zip" \
              "https://downloads.gradle.org/distributions/gradle-$V-bin.zip" \
              "https://github.com/gradle/gradle-distributions/releases/download/v$V/gradle-$V-bin.zip"; do
              if curl -fL --retry 2 --retry-delay 5 -o gradle.zip "$U"; then ok=1; break 2; fi
            done
            sleep 20
          done
          [ "$ok" = 1 ] || { echo "Could not download Gradle"; exit 1; }
          unzip -q gradle.zip -d "$HOME"
          echo "$HOME/gradle-$V/bin" >> "$GITHUB_PATH"
      - name: Build
        shell: bash
        run: |
          n=0
          until gradle build --no-daemon --console=plain 2>&1 | tee build.log; do
            n=$((n+1))
            [ "$n" -ge 3 ] && exit 1
            echo "Build failed, retrying in 20s ($n/3)"
            sleep 20
          done
      - name: Show errors
        if: failure()
        shell: bash
        run: |
          grep -n -B2 -A8 -E "error:|What went wrong" build.log | head -120
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-log
          path: build.log
      - uses: actions/upload-artifact@v4
        with:
          name: PulseFX-jar
          path: build/libs/pulsefx-*[!s].jar
